name: "geocoder"
version: "1.0.0"

profile: "geocoder"

model-paths: ["models"]
macro-paths: ["macros", "shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  geocoder:
    +database: geocoder
    main:
      # ジオコーダーは市区町村 (lg_code) で絞って読む。表を lg_code の順に並べ、行グループを
      # 小さくして、1 市区町村で読む量を数百 KB に抑える。設定はスキーマに付く
      # (dbt は __dbt_tmp に書いてから改名するので、テーブルに付けても効かない)
      #
      # 行グループは DuckDB が並列に書く単位 (122,880 行) を割り切る大きさにする。32,768 行
      # だと単位の端の端数が別の単位の行と 1 つの行グループにまとめられ、並べた順が
      # 行グループの中で崩れて lg_code の範囲が重なった
      +pre-hook:
        - "CALL geocoder.set_option('parquet_row_group_size', 30720, schema => 'main')"
        - "CALL geocoder.set_option('parquet_compression', 'zstd', schema => 'main')"
      mart:
        +materialized: table
        # Worker はファイルを丸ごと読む (Workers の静的アセットは Range を受けない)。1 ファイルを数 MB に収めるよう、
        # 住居表示・地番・番号の索引は市区町村 (lg_code=…/)、町字と照合の区域は都道府県 (pref_code=…/)、
        # 町名の索引は頭の文字 (name_bucket=…/) ごとにファイルを分ける。
        # DuckDB は分けて書くとき、並列に書くと並びが崩れ、1 つの値の行が多くの行グループに散る
        # (Worker は行グループの最小・最大で絞って読むので、展開する行が増える)。分けるテーブルは 1 スレッドで書き、
        # 書き出しの区切りを行グループ (30,720 行と 4,096 行) の倍数にして並びを保つ。
        # 入力が lg_code の順なので、1 スレッドなら市区町村ごとのファイルも 1 つずつ書き終わる
        parcel: &by_city
          +partitioned_by: lg_code
          +pre-hook:
            - "SET threads = 1"
            - "SET partitioned_write_flush_threshold = 491520"
          +post-hook: &reset_write
            - "RESET threads"
            - "RESET partitioned_write_flush_threshold"
        rsdtdsp: *by_city
        match_number: *by_city
        # 町字の表は市区町村ごとに 1 回ずつ読む (1 市区町村は平均 384 行)。30,720 行の行グループだと
        # 1 市区町村のたびに 3 万行を展開し、ばらばらの市区町村の一括変換で CPU の上限を超えた。
        # 町字のテーブルだけ別のスキーマに置き、行グループを 4,096 行にする
        town: &by_prefecture
          +schema: town
          +partitioned_by: pref_code
          +pre-hook:
            - "CREATE SCHEMA IF NOT EXISTS geocoder.town"
            - "CALL geocoder.set_option('parquet_row_group_size', 4096, schema => 'town')"
            - "CALL geocoder.set_option('parquet_compression', 'zstd', schema => 'town')"
            - "SET threads = 1"
            - "SET partitioned_write_flush_threshold = 491520"
          +post-hook: *reset_write
        # 照合の区域も市区町村ごとに 1 回ずつ読むので、町字のテーブルと同じ置き場にする
        match_area: *by_prefecture
        # 町名の索引も頭 2 文字で行グループを絞って読むので、町字のテーブルと同じ置き場にする
        town_name:
          <<: *by_prefecture
          +partitioned_by: name_bucket
        # 旧市区町村名の索引も、頭 2 文字で 1 つの行グループだけを読む
        former_city:
          +schema: town
          +pre-hook:
            - "CREATE SCHEMA IF NOT EXISTS geocoder.town"
            - "CALL geocoder.set_option('parquet_row_group_size', 4096, schema => 'town')"
            - "CALL geocoder.set_option('parquet_compression', 'zstd', schema => 'town')"
