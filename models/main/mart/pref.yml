version: 2

models:
  - name: pref
    description: |
      都道府県の名前と代表点。
      「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。
    access: public
    columns:
      - name: lg_code
        data_type: varchar
      - name: pref_code
        data_type: varchar
      - name: pref_name
        data_type: varchar
      - name: lng
        data_type: double
      - name: lat
        data_type: double
