schema: main
name: parcel
title: 地番の住所
description: |
  地番の住所（「○番地」「○番○」）と代表点。住居表示でない町字の分。座標の付く筆は一部だけ。
  「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。
keywords:
  - 住所
  - 地番
  - ジオコーディング
sources:
  - path: https://dataset.address-br.digital.go.jp/
fields:
  - name: machiaza_key
    title: 町字キー
    description: "lg_code と machiaza_id をつないだもの (13桁)。この順に並ぶ"
  - name: lg_code
    title: 全国地方公共団体コード
    description: "6桁（検査数字あり）"
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: machiaza_id
    title: 町字ID
    description: "town と lg_code・machiaza_id で結合する"
  - name: prc_id
    title: 地番ID
  - name: prc_num1
    title: 地番1
    description: "住所の「○番地」の部分"
  - name: prc_num2
    title: 地番2
    description: "枝番。無い筆は NULL"
  - name: prc_num3
    title: 地番3
    description: "枝番の枝番。無い筆は NULL"
  - name: lng
    title: 経度
    description: "代表点の経度。代表点の無い筆は NULL"
  - name: lat
    title: 緯度
    description: "代表点の緯度。代表点の無い筆は NULL"
