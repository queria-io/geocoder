version: 2

models:
  - name: moj_parcel
    description: |
      法務省の登記所備付地図の筆の代表点を、ABR の町字と地番の番号に付けたもの。ABR に同じ地番の点が無い筆だけ。
      公共座標系の図面の筆で、地番が数字とハイフンだけのもの、大字・町、丁目、小字の名前が ABR の町字と完全に一致するものだけを使う。
      「登記所備付地図データ」（法務省）を加工して作成。町字は「アドレス・ベース・レジストリ」（デジタル庁）。
    access: public
    columns:
      - name: machiaza_key
        data_type: varchar
      - name: lg_code
        data_type: varchar
      - name: machiaza_id
        data_type: varchar
      - name: prc_num1
        data_type: varchar
      - name: prc_num2
        data_type: varchar
      - name: prc_num3
        data_type: varchar
      - name: lng
        data_type: double
      - name: lat
        data_type: double
