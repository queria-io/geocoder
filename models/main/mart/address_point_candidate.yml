version: 2

models:
  - name: address_point_candidate
    description: |
      住所ごとの点の候補。出どころごとに 1 行。座標のある行だけ。
      「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）、「街区レベル位置参照情報」（国土交通省）（https://nlftp.mlit.go.jp/isj/）を加工して作成。
    access: public
    columns:
      - name: lg_code
        data_type: varchar
      - name: machiaza_id
        data_type: varchar
      - name: system
        data_type: varchar
      - name: num1
        data_type: varchar
      - name: num2
        data_type: varchar
      - name: num3
        data_type: varchar
      - name: point_type
        data_type: varchar
      - name: source
        data_type: varchar
      - name: lng
        data_type: double
      - name: lat
        data_type: double
