version: 2

models:
  - name: city
    description: |
      全国の市区町村（政令市の区を含む）の名前と代表点。住所の頭から市区町村を切り出すのに使う。
      「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。
    access: public
    columns:
      - name: lg_code
        data_type: varchar
      - name: pref_code
        data_type: varchar
      - name: pref_name
        data_type: varchar
      - name: county_name
        data_type: varchar
      - name: city_name
        data_type: varchar
      - name: ward_name
        data_type: varchar
      - name: lng
        data_type: double
      - name: lat
        data_type: double
