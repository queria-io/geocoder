version: 2

models:
  - name: city
    access: public
    columns:
      - name: lg_code
        data_type: varchar
      - name: pref_code
        data_type: varchar
      - name: pref_name
        data_type: varchar
      - name: county_name
        data_type: varchar
      - name: city_name
        data_type: varchar
      - name: ward_name
        data_type: varchar
      - name: lng
        data_type: double
      - name: lat
        data_type: double
      - name: population
        data_type: bigint
