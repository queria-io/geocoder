version: 2

models:
  - name: town_name
    description: |
      町字ごとの名前・丁目・小字と、その町字にある番号の索引。市区町村名を書かない住所から、その住所を持つ市区町村を引くのに使う。
      「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）と「街区レベル位置参照情報　国土交通省」を加工して作成。
    access: public
    columns:
      - name: name_key
        data_type: varchar
      - name: name_bucket
        data_type: integer
      - name: name
        data_type: varchar
      - name: lg_code
        data_type: varchar
      - name: chome
        data_type: integer
      - name: koaza
        data_type: varchar
      - name: numbers
        data_type: integer[]
