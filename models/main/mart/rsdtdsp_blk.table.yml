schema: main
name: rsdtdsp_blk
title: 住居表示 街区
description: |
  住居表示の街区（「○丁目1番」の「1番」）と代表点。
  「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。
keywords:
  - 住所
  - 住居表示
  - 街区
  - ジオコーディング
sources:
  - path: https://dataset.address-br.digital.go.jp/
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: "6桁（検査数字あり）"
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: machiaza_id
    title: 町字ID
    description: "town と lg_code・machiaza_id で結合する"
  - name: blk_id
    title: 街区ID
  - name: blk_num
    title: 街区符号
    description: "住所の「○番」の部分"
  - name: lng
    title: 経度
    description: "代表点の経度。元データ (ABR 位置参照拡張) のまま。代表点の無い行は NULL"
  - name: lat
    title: 緯度
    description: "代表点の緯度。元データ (ABR 位置参照拡張) のまま。代表点の無い行は NULL"
