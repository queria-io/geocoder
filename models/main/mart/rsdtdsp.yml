version: 2

models:
  - name: rsdtdsp
    description: |
      住居表示の住所（「○番」「○番○号」）と代表点。街区だけの行と、街区と住居の行を 1 つの表にまとめる。住居表示を実施した町字の分だけ。
      「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。
    access: public
    columns:
      - name: machiaza_key
        data_type: varchar
      - name: lg_code
        data_type: varchar
      - name: machiaza_id
        data_type: varchar
      - name: blk_id
        data_type: varchar
      - name: rsdt_id
        data_type: varchar
      - name: rsdt2_id
        data_type: varchar
      - name: blk_num
        data_type: varchar
      - name: rsdt_num
        data_type: varchar
      - name: rsdt_num2
        data_type: varchar
      - name: lng
        data_type: double
      - name: lat
        data_type: double
