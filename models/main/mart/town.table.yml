schema: town
name: town
title: 町字
description: |
  全国の町字の名前・別名・代表点と、代表点が入る国勢調査の小地域。住所の文字列を町字に当てるのに使う。名前の中の全角の英数字・記号は半角にそろえる。
  「アドレス・ベース・レジストリ」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。
  小地域は「国勢調査 町丁・字等別境界データ」（総務省統計局）（https://www.e-stat.go.jp/gis）を使用。
  どこにも代表点の無い大字・町は「大字・町丁目レベル位置参照情報」（国土交通省）（https://nlftp.mlit.go.jp/isj/）の点で埋める。
keywords:
  - 住所
  - 町字
  - ジオコーディング
  - 小地域
sources:
  - path: https://dataset.address-br.digital.go.jp/
  - path: https://www.e-stat.go.jp/gis
  - path: https://nlftp.mlit.go.jp/isj/
fields:
  - name: lg_code
    title: 全国地方公共団体コード
    description: "6桁（検査数字あり）"
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: machiaza_id
    title: 町字ID
  - name: machiaza_type
    title: 町字区分コード
  - name: pref_name
    title: 都道府県名
  - name: county_name
    title: 郡名
  - name: city_name
    title: 市区町村名
  - name: ward_name
    title: 政令市区名
  - name: oaza_cho
    title: 大字・町名
  - name: chome
    title: 丁目名
    description: "「１丁目」のような全角数字"
  - name: koaza
    title: 小字名
  - name: kyoto_street
    title: 京都の通り名
    description: "true は koaza が「烏丸通鞍馬口上る」のような京都の通り名のもの。住所では町名の前に書く"
  - name: machiaza_dist
    title: 同じ名前の町字の区別
    description: "同じ市区町村に同じ名前の町字があるときに見分けるための文字列。住所の表記には含まれない"
  - name: has_chome
    title: 丁目がある
    description: "true はこの町字か、同じ大字・町のどれかに丁目があるもの。町名のすぐ後の数字を丁目と読むかどうかに使う"
  - name: rsdtdsp_count
    title: 住居表示の住所の数
    description: "rsdtdsp の表にあるこの町字の行の数。住居表示を実施していない町字は 0"
  - name: parcel_count
    title: 地番の数
    description: "parcel の表にあるこの町字の地番の数"
  - name: alias_oaza
    title: 大字・町名の別名
  - name: alias_koaza
    title: 小字名の別名
  - name: rsdt_addr_flg
    title: 住居表示フラグ
    description: "'1' は住居表示の町字で、rsdtdsp_blk・rsdtdsp_rsdt まで引ける"
  - name: rsdt_addr_partial
    title: 一部だけ住居表示
    description: "true は住居表示の町字の中に地番で表す住所も残っているもの。rsdt_addr_flg は '1'"
  - name: wake_num_flg
    title: 起番フラグ
    description: "'1' はこの町字で地番が振られている、'2' は振られていない、'0' は登記情報に無い"
  - name: numbering_id
    title: 地番の区域の町字ID
    description: "この町字の地番が振られている町字。小字が起番でなければ大字・町の町字 ID。address_point の地番は町字そのものとこの町字の両方で引く"
  - name: parcel_unique
    title: 地番が区域で一意
    description: "true は numbering_id の町字の中で地番が 1 つに決まる。false は小字ごとに地番が振られた大字・町で、小字を省いた地番の住所は当てない"
  - name: post_code
    title: 郵便番号
  - name: efct_date
    title: 効力発生日
  - name: lng
    title: 経度
    description: "代表点の経度。元データ (ABR 位置参照拡張) のまま。出どころは point_level"
  - name: lat
    title: 緯度
    description: "代表点の緯度。元データ (ABR 位置参照拡張) のまま。出どころは point_level"
  - name: point_level
    title: 代表点の出どころ
    description: "town は町字自身の代表点、parent_town は代表点の無い小字などに同じ大字・町の代表点を使ったもの、oaza_mean は大字・町にも代表点が無いときに同じ大字・町の小字などの代表点を平均したもの。isj_oaza はそれも無いときに位置参照情報の大字・町丁目の点を名前で当てたもの。どれも無い町字は NULL"
  - name: small_area_code
    title: 小地域コード
    description: "lng / lat の点が入る国勢調査の小地域 (KEY_CODE)。町字と小地域は 1 対 1 ではなく、これは代表点 1 点で決めたもの。代表点の無い町字は NULL"
    annotations: { queria: { semantic: { role: entity, name: small_area } } }