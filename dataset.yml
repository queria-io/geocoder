# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: geocoder
title: ジオコーダー用 住所マスタ
description: |-
  住所の文字列と座標・地域コードを相互に引くための表。
  「アドレス・ベース・レジストリ」（デジタル庁）、「国勢調査 町丁・字等別境界データ」（総務省統計局）、
  「街区レベル位置参照情報」（国土交通省）を加工して作成。
  元にした Queria のデータセットは address_br・e_stat・nlftp。
keywords:
  - 住所
  - ジオコーディング
  - 町字
  - 住居表示
  - 小地域
homepage: https://github.com/queria-io/geocoder
language: ja

licenses:
  - JP-DIGITAL-ADDRESS-BR
  - JP-GOV-STD-2.0
  - JP-MLIT-NLFTP

sources:
  - title: アドレス・ベース・レジストリ（デジタル庁）
    path: https://dataset.address-br.digital.go.jp/
  - title: 国勢調査 町丁・字等別境界データ（総務省統計局）
    path: https://www.e-stat.go.jp/gis
  - title: 街区レベル位置参照情報（国土交通省）
    path: https://nlftp.mlit.go.jp/isj/

contributors:
  - title: デジタル庁
    path: https://www.digital.go.jp/
    roles: [rightsHolder]
  - title: 総務省統計局
    path: https://www.stat.go.jp/
    roles: [rightsHolder]
  - title: 国土交通省
    path: https://www.mlit.go.jp/
    roles: [rightsHolder]

spatial_coverage: [JP]
update_frequency: monthly

schemas:
  - name: main
    title: メイン
  - name: town
    title: 町字

annotations:
  queria:
    themes: [land_climate]
    cover: 📍
    ai_context:
      instructions: |
        住所の文字列から座標と地域コードを引く (正引き)、町字を国勢調査の小地域につなぐのに使う。
        表は lg_code の順に並べてあり、市区町村で絞ると読む量が小さい。座標は lng / lat の数値の列。
        town は町字ごとの名前・別名・代表点と、代表点が入る小地域 (small_area_code)。町字と小地域は
        1 対 1 ではないので、small_area_code は代表点 1 点で決めた目安。
        住居表示の町字 (town.rsdt_addr_flg = '1') は rsdtdsp_blk (「○番」) と rsdtdsp_rsdt (「○号」) まで引ける。
        結合キーは lg_code, machiaza_id（町字）、blk_id（街区）、rsdt_id, rsdt2_id（住居）。
        isj_block は国交省の位置参照情報の街区・地番の親番の点で、ABR に座標の無い地番の住所の点に使う。
      synonyms: [ジオコーダー, ジオコーディング, 住所マスタ]
      examples:
        - 住所から緯度経度を引きたい
        - 町字を国勢調査の小地域につなぎたい
