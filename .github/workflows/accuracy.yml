name: Accuracy

# マージ前の精度チェック: Worker を変える PR では、Workers Builds がブランチごとに作るプレビュー版に
# 3,000 件 (地価公示・指定避難所・介護サービス事業所) を送り、本番の結果より悪くなっていれば失敗にする。
# 本番の結果は、本番が変わったときに Bench (bench.yml) が残したものを使い、PR ごとには本番に送らない。
# プレビュー版も本番と同じデータを読むので、差は Worker の変更だけから出る
on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/accuracy.yml"

concurrency:
  group: accuracy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 本番の結果を取得する
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bench が main で最後に残した本番の結果。住所の一覧がこの PR と同じときだけ基準に使う
          run=$(gh run list --workflow bench.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ] && gh run download "$run" --dir bench/base-run \
            && cmp -s "$(find bench/base-run -name truth-forward.csv | head -1)" bench/golden/truth-forward.csv; then
            cp "$(find bench/base-run -name forward.jsonl | head -1)" bench/base.jsonl
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::住所の一覧が同じ Bench の結果が無いので、本番にも住所を送る"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: プレビュー版のデプロイの完了を待つ
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Workers Builds の check run の summary に、その版だけを指す Preview URL が載る
          for _ in $(seq 1 60); do
            run=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              -f check_name="Workers Builds: queria-geocoder" -X GET \
              --jq '.check_runs[0] // {} | {status, conclusion, summary: .output.summary}')
            if [ "$(jq -r .status <<< "$run")" = completed ]; then
              if [ "$(jq -r .conclusion <<< "$run")" != success ]; then
                echo "::error::Workers Builds: $(jq -r .conclusion <<< "$run")"
                exit 1
              fi
              url=$(jq -r .summary <<< "$run" | grep -o 'Preview URL: https://[^ )]*' | head -1 | cut -d' ' -f3 || true)
              if [ -z "$url" ]; then
                echo "::error::Preview URL が check run に見つからない"
                exit 1
              fi
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Workers Builds の check run が 20 分で終わらなかった (ブランチのビルドが有効か確かめる)"
          exit 1
      - name: 本番に住所を送って評価する
        if: steps.base.outputs.found != 'true'
        env:
          BATCH: "5"
          LANES: "4"
        run: BASE=https://geocoder.queria.io pnpm exec tsx bench/forward-eval.ts bench/golden/truth-forward.csv bench/base.jsonl > bench/base.md
      - name: プレビュー版に住所を送って評価する
        env:
          BASE: ${{ steps.preview.outputs.url }}
          # 25 件まとめは 1 回の CPU が上限に当たりやすい。5 件ずつ 4 本並べる
          BATCH: "5"
          LANES: "4"
        run: pnpm exec tsx bench/forward-eval.ts bench/golden/truth-forward.csv bench/head.jsonl > bench/head.md
      - name: 本番の精度と比較して判定する
        run: pnpm exec tsx bench/gate.ts bench/base.jsonl bench/head.jsonl | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: worker/bench/*.jsonl
          retention-days: 30
