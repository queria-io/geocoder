name: Accuracy

# マージ前の精度チェック: PR の Worker とデータで住所の一覧 (地価公示・指定避難所・介護サービス事業所) を
# 照合し、本番の結果より悪くなっていれば失敗にする。本番の結果は、本番が変わったときに Bench (bench.yml) が
# 残したものを使い、PR ごとには本番に送らない。
#
# データは、PR で変えたモデルとその下流だけを作り直し (dbt の state:modified+)、ほかの表は本番のファイルを読む。
# 作り直した表はランナーの中に置くだけで、どこにも上げない。Worker はランナーの中で動かす (bench/local/)
on:
  pull_request:
    paths:
      - "worker/**"
      - "models/**"
      - "macros/**"
      - "dbt_project.yml"
      - "scripts/local-version.py"
      - ".github/workflows/accuracy.yml"

concurrency:
  group: accuracy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      # data.queria.io の回数の上限を、ランナーの IP ではなくこのトークンで数える
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      # fdl checkout は fdl.json と refs をこのトークンで読む (sync.yml と同じ)
      FDL_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      QUERIA_USER_AGENT: queria-build/accuracy
    defaults:
      run:
        working-directory: worker
    steps:
      - name: ディスクを空ける
        # parcel を作り直すと DuckDB の一時ファイルが 11GB を超える (sync.yml と同じ)
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 本番の結果を取得する
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bench が main で最後に残した本番の結果。住所の一覧がこの PR と同じときだけ基準に使う。
          # 最新の実行が失敗・実行中なら、本番はその前の成功した実行から変わっているかもしれないので使わない
          run=$(gh run list --workflow bench.yml --branch main --limit 20 --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion != "skipped")][0] | select(.conclusion == "success") | .databaseId')
          if [ -n "$run" ] && gh run download "$run" --dir bench/base-run \
            && cmp -s "$(find bench/base-run -name truth-forward.csv | head -1)" bench/golden/truth-forward.csv; then
            cp "$(find bench/base-run -name forward.jsonl | head -1)" bench/base.jsonl
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::住所の一覧が同じ Bench の結果が無いので、本番にも住所を送る"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: PR で変えたモデルとその下流を作り直す
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Sync と同じく、fdl は最新版を使う
          uv lock --upgrade-package fdl-cli
          uv sync
          # 本番のバージョンを作業場に取り出す。作り直さない表は本番のファイルを指したまま残る
          uv run fdl checkout https://data.queria.io/datasets/queria/geocoder/ .fdl/work.sqlite
          export FDL_WORKING="$PWD/.fdl/work.sqlite" FDL_DATA_PATH="$PWD/.fdl/work.sqlite.data/"
          # 比較の基準は PR の分岐元のモデル (本番のデータは main から Sync が作る)
          git worktree add -q ../base "$BASE_SHA"
          git -C ../base submodule update -q --init
          (cd ../base && uv run --project "$GITHUB_WORKSPACE" dbt deps -q && uv run --project "$GITHUB_WORKSPACE" dbt parse -q)
          uv run dbt deps -q
          uv run dbt run -s state:modified+ --state ../base/target
          uv run python scripts/local-version.py .fdl/work.sqlite "$FDL_DATA_PATH"
      - name: PR の Worker とデータで住所を照合して評価する
        env:
          FOUND: ${{ steps.base.outputs.found }}
        run: |
          printf 'QUERIA_TOKEN=%s\n' "$QUERIA_TOKEN" > bench/local/.dev.vars
          pnpm exec tsx bench/local/serve.ts ../.fdl/work.sqlite.data 8788 &
          pnpm exec wrangler dev -c bench/local/wrangler.jsonc --port 8787 > bench/wrangler.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8787/openapi.json && break; sleep 2; done
          pids=()
          if [ "$FOUND" != true ]; then
            BASE=https://geocoder.queria.io BATCH=5 LANES=4 pnpm exec tsx bench/forward-eval.ts bench/golden/truth-forward.csv bench/base.jsonl > bench/base.md &
            pids+=($!)
          fi
          BASE=http://127.0.0.1:8787 LANES=4 pnpm exec tsx bench/forward-eval.ts bench/golden/truth-forward.csv bench/head.jsonl > bench/head.md &
          pids+=($!)
          for pid in "${pids[@]}"; do wait "$pid"; done
      - name: 本番の精度と比較して判定する
        run: pnpm exec tsx bench/gate.ts bench/base.jsonl bench/head.jsonl | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            worker/bench/*.jsonl
            worker/bench/wrangler.log
          retention-days: 30
