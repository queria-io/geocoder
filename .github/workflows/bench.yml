name: Bench

# 正引きの物差し: 地価公示・指定避難所・介護サービス事業所の住所 3,000 件を本番の API に流し、
# 当たった段と座標の誤差を表にする。表はジョブの Summary に、1 件ごとの答えは Artifact に残す
on:
  schedule:
    - cron: "0 21 * * 0" # 毎週月曜 6:00 (日本時間)
  workflow_run:
    workflows: [Sync]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  forward:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 実住所と座標の組を作る
        run: uv run --with 'duckdb>=1.4,<2' python bench/truth-forward.py 1000 > bench/truth-forward.csv
      - name: 前回の答えを取る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow bench.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$prev" ]; then gh run download "$prev" --dir bench/prev || true; fi
      - name: Sync のあとは Worker が新しいバージョンを読むまで待つ
        if: github.event_name == 'workflow_run'
        run: sleep 360 # Worker は refs と files.json を 5 分覚える
      - name: 本番に流す
        run: |
          set -o pipefail
          export PREV=$(find bench/prev -name forward.jsonl 2>/dev/null | head -1)
          pnpm exec tsx bench/forward-eval.ts bench/truth-forward.csv bench/forward.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: forward-${{ github.run_id }}
          path: |
            worker/bench/truth-forward.csv
            worker/bench/forward.jsonl
          retention-days: 90
