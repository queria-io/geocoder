name: Bench

# 正引きのベンチマーク: 地価公示・指定避難所・介護サービス事業所の住所 3,000 件を本番の API に送り、
# 照合レベルと座標の誤差を表にする。表はジョブの Summary に、1 件ごとの結果は Artifact に残す。
# 本番の結果が変わるのは Worker のデプロイとデータの Sync のときだけなので、そのときだけ実行する。
# ここで残した結果が、PR の精度チェック (accuracy.yml) の基準になる
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_run:
    workflows: [Sync]
    types: [completed]
  workflow_dispatch:

jobs:
  forward:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 前回の結果を取得する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow bench.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$prev" ]; then gh run download "$prev" --dir bench/prev || true; fi
      - name: 本番へのデプロイの完了を待つ
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 1 60); do
            status=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              -f check_name="Workers Builds: queria-geocoder" -X GET --jq '.check_runs[0].status // ""')
            [ "$status" = completed ] && exit 0
            sleep 20
          done
          echo "::error::Workers Builds が 20 分で終わらなかった"
          exit 1
      - name: Sync の後は Worker が新しいバージョンを読むまで待つ
        if: github.event_name == 'workflow_run'
        run: sleep 360 # Worker は refs と files.json を 5 分キャッシュする
      - name: 本番に住所を送って評価する
        env:
          # 25 件まとめは 1 回の CPU が上限に当たりやすい。5 件ずつ 4 本並べる
          BATCH: "5"
          LANES: "4"
        run: |
          set -o pipefail
          export PREV=$(find bench/prev -name forward.jsonl 2>/dev/null | head -1)
          pnpm exec tsx bench/forward-eval.ts bench/golden/truth-forward.csv bench/forward.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: forward-${{ github.run_id }}
          path: |
            worker/bench/golden/truth-forward.csv
            worker/bench/forward.jsonl
          retention-days: 90
