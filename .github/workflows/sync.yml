name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "worker/**" # Worker の変更ではデータを作り直さない
      - "integrations/**" # 呼び出し例の変更ではデータを作り直さない
  schedule:
    - cron: "0 19 2 * *" # address_br の Sync（0 19 1 * *）の翌日に、その更新を受けて作り直す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: geocoder
      # parcel の作成で DuckDB の一時ファイルが 11GB を超え、ランナーのディスクが足りなくなる
      free_disk: true
    secrets: inherit

  # 本番の Worker は、デプロイのときの最新バージョンのデータを静的アセットに置いて読む (worker/scripts/build-data.mjs)。
  # データを作り直したら、production ブランチの本番のビルドを流して新しいバージョンを置き直す
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: 本番のビルドを流す
        env:
          DEPLOY_HOOK_URL: ${{ secrets.GEOCODER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::GEOCODER_DEPLOY_HOOK_URL が無いので、本番のビルドを流さない"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null
